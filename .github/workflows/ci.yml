name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/campaign-absorption

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  design-lab-installed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the framework and six independent projects
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/lab-consumer"
          "$RUNNER_TEMP/lab-consumer/bin/python" -m pip install dist/*.whl examples/projects/react_research examples/projects/planact_research examples/projects/pi_coding examples/projects/claude_coding examples/projects/hermes_notebook examples/projects/voyager_skills
      - name: Run offline mechanisms and horizontal composition outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          unset PYTHONPATH
          "$RUNNER_TEMP/lab-consumer/bin/python" "$GITHUB_WORKSPACE/tests/fixtures/design_lab/installed_consumer.py" "$GITHUB_WORKSPACE/examples/projects"
          "$RUNNER_TEMP/lab-consumer/bin/python" "$GITHUB_WORKSPACE/tests/fixtures/design_lab/composition_consumer.py" "$GITHUB_WORKSPACE/examples/projects/planact_research/agent.yaml"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev,models,benchmarks]" pytest-asyncio==1.3.0

      - name: Build owned sandbox fixtures
        run: |
          docker build -f .github/ci/Dockerfile.sandbox -t qitos-ci-sandbox .github/ci
          docker tag qitos-ci-sandbox qitos-g5-qualification:20260904
          docker tag qitos-ci-sandbox qitos-s3-g4-qualification:pytest-debian
          docker tag qitos-ci-sandbox openclaw:staged
          docker image inspect qitos-ci-sandbox --format '{{.Id}}'

      - name: Run tests
        run: pytest -q --junitxml=test-results.xml

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 14

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev,models,benchmarks]" pytest-asyncio==1.3.0

      - name: Build owned sandbox fixtures
        run: |
          docker build -f .github/ci/Dockerfile.sandbox -t qitos-ci-sandbox .github/ci
          docker tag qitos-ci-sandbox qitos-g5-qualification:20260904
          docker tag qitos-ci-sandbox qitos-s3-g4-qualification:pytest-debian
          docker tag qitos-ci-sandbox openclaw:staged
          docker image inspect qitos-ci-sandbox --format '{{.Id}}'

      - name: Enforce coverage floor
        run: pytest --cov=qitos.core --cov=qitos.engine --cov=qitos.trace --cov-report=term --cov-fail-under=80 -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Preserve candidate distributions without publishing
        uses: actions/upload-artifact@v4
        with:
          name: candidate-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  lint-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -r requirements/quality.txt

      - name: Lint stable surface
        run: flake8 qitos/core qitos/engine qitos/models qitos/trace

  type-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install typing dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -r requirements/quality.txt
          python -m pip install requests beautifulsoup4 pyyaml openai -r .github/ci/typing-context.txt

      - name: Type-check stable surface
        run: mypy qitos/core qitos/engine qitos/models qitos/trace

  static-ratchet:
    name: full-package no-regression ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUALITY_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pinned diagnostic Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install package and pinned quality toolchain
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev,models,benchmarks]" pytest-asyncio==1.3.0
          python -m pip install -r requirements/quality.txt -r .github/ci/typing-context.txt

      - name: Enforce full-package no-regression baseline
        run: python scripts/static_quality.py check

  architecture-boundaries:
    name: architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev,models,benchmarks]" pytest-asyncio==1.3.0

      - name: Enforce architecture boundaries
        run: pytest -q tests/test_architecture_boundaries.py

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0" wheel
          python -m pip install -e ".[dev,models,benchmarks]" pytest-asyncio==1.3.0

      - name: Audit Python dependencies
        run: pip-audit --progress-spinner off
