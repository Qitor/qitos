name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models,benchmarks]"

      - name: Run tests
        run: pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models,benchmarks]"

      - name: Enforce coverage floor
        run: pytest --cov=qitos.core --cov=qitos.engine --cov=qitos.trace --cov-report=term --cov-fail-under=80 -q

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

  lint-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/quality.txt

      - name: Lint stable surface
        run: flake8 qitos/core qitos/engine qitos/models qitos/trace

  type-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install typing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/quality.txt
          python -m pip install requests beautifulsoup4 pyyaml openai

      - name: Type-check stable surface
        run: mypy qitos/core qitos/engine qitos/models qitos/trace

  static-ratchet:
    name: full-package no-regression ratchet
    runs-on: ubuntu-latest
    env:
      QUALITY_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout with baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pinned diagnostic Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install package and pinned quality toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models,benchmarks]"
          python -m pip install -r requirements/quality.txt

      - name: Enforce full-package no-regression baseline
        run: python scripts/static_quality.py check

  architecture-boundaries:
    name: architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models,benchmarks]"

      - name: Enforce architecture boundaries
        run: pytest -q tests/test_architecture_boundaries.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audited environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models,benchmarks]"

      - name: Audit Python dependencies
        run: pip-audit --progress-spinner off
