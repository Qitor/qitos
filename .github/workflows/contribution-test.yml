name: contribution checks (advisory)

on:
  pull_request:
    paths:
      - 'qitos/kit/tool/**'
      - 'qitos/kit/parser/**'
      - 'qitos/kit/critic/**'
      - 'qitos/kit/embedding/**'
      - 'qitos/protocols.py'
      - 'qitos/core/**'
      - 'qitos/engine/critic_decorator.py'
      - 'tests/core/**'
      - 'tests/engine/**'
      - 'tests/kit/**'
      - '.github/workflows/contribution-test.yml'

jobs:
  tool-schema-check:
    name: advisory - tool schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate tool schemas
        run: python scripts/qualify_tool_schemas.py

  parser-contract-check:
    name: advisory - parser contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check parser contract_id uniqueness
        run: |
          python -c "
          from qitos.protocols import list_protocols
          ids = [p for p in list_protocols()]
          if len(ids) != len(set(ids)):
              dupes = [i for i in ids if ids.count(i) > 1]
              raise ValueError(f'Duplicate protocol IDs: {set(dupes)}')
          print(f'All {len(ids)} protocol IDs are unique')
          "

  affected-tests:
    name: advisory - contribution-focused tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,models]"

      - name: Run affected test subsets
        run: pytest tests/core/ tests/engine/ tests/kit/ -q --tb=short

  critic-test:
    name: advisory - critic integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run critic tests
        run: pytest tests/engine/test_critic_decorator.py tests/kit/ -q --tb=short
