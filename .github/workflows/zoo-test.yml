name: stale zoo migration inventory (advisory)

on:
  pull_request:
    paths:
      - 'docs/internal/plans/qitos_zoo_migration/**'
      - 'qitos_zoo/**'
      - '.github/workflows/zoo-test.yml'
  workflow_dispatch:

jobs:
  stale-zoo-inventory:
    name: advisory - stale zoo migration inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record out-of-tree migration staging
        run: |
          python - <<'PY'
          from pathlib import Path

          staging = Path("docs/internal/plans/qitos_zoo_migration")
          manifest = staging / "MIGRATION_MANIFEST.md"
          if not staging.is_dir() or not manifest.is_file():
              raise SystemExit("zoo migration inventory is missing")

          apps = sorted(
              path.relative_to(staging).as_posix()
              for path in (staging / "apps").iterdir()
              if path.is_dir()
          )
          print(f"Advisory stale inventory only; staged apps: {apps}")
          print("Runtime and product tests belong to the out-of-tree qitos-zoo repository.")
          PY
