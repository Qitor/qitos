[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  ".git",
  ".venv",
  "venv",
  "build",
  "dist",
  "site",
  "references",
  "qitos.egg-info",
  ".pytest_cache",
  "__pycache__",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
# This remains the stable-surface zero-debt configuration. The full-package
# ratchet deliberately bypasses these historical package exclusions/overrides
# via quality/mypy.ini and itemizes every resulting error in its baseline.
exclude = [
  "^qitos/benchmark/",
  "^qitos/kit/tool/experimental/",
  "^site/",
  "^dist/",
]

[[tool.mypy.overrides]]
# Historical stable-gate compatibility only; never use this override for the
# full-package signal. See quality/README.md and quality/static_baseline.json.
module = [
  "qitos.kit.*",
  "qitos.render.*",
  "qitos.benchmark.*",
]
ignore_errors = true
