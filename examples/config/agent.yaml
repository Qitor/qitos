schema: qitos.agent
agent:
  name: example-coding-agent
  protocol: auto
  parser: auto
  seed: 0
model:
  provider: openai_compatible
  model: example-model
  base_url: https://provider.example/v1
  credential:
    ref: example-openai-compatible
  api_mode: chat_completions
  context_window: 32768
  request:
    temperature: 0.0
    max_tokens: 2048
    timeout_seconds: 180
    extra_body: {}
tools:
  preset: env_coding
  include: []
  options: {}
  policy: auto
runtime:
  environment:
    type: docker
    image: python:3.12-slim
    workspace: .
    container_workspace: /workspace
    network: none
    read_only_root: true
    cap_drop: true
    no_new_privileges: true
    pids_limit: 256
    memory_mb: 2048
    cpus: 2.0
    cleanup_required: true
  session:
    mode: durable
    store: sqlite
    path: ./.qitos/example-sessions.sqlite3
  trajectory:
    enabled: true
    output: ./runs
    privacy: private
    failure_policy: required
budgets:
  max_steps: 10
  max_runtime_seconds: 600
  max_requests: 12
context: {}
memory: {}
compaction: {}
lifecycle:
  policy: cooperative
failure_policy:
  tool: fail_closed
metadata:
  purpose: provider-neutral-launch-example
dataset:
  - task: Inspect the workspace and report one verified fact.
